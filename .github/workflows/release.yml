name: release

# A tag is a release, and a release has notes. This runs on every v* tag,
# refuses the tag when CHANGELOG.md has no section for it, and otherwise
# publishes the GitHub release with that section as the body. The same script
# runs in the pre-push hook, so the failure normally happens on the laptop.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the release note for this tag
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
