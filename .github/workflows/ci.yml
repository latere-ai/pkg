name: ci

# The gates this module runs on every push live in latere-ai/ci (which orders
# them) and latere.ai/x/ci-gate (which decides what each asserts), and are
# reached through this repository's Makefile.
#
# Sixteen repositories depend on this module, so a gate that slips here slips
# fleet-wide. Every one of them also runs locally -- `make cover`, `make deps`,
# `make test-hermetic` and the rest need nothing but this checkout -- which is
# the point: a gate you can only run in CI tells you too late.
#
# `make validate` carries the five checks specific to what this module
# promises: no internal specs tracked in a public repository, llmdialect
# staying stdlib-only, no cgo anywhere, govulncheck over what this module
# imports or calls, and the fuzz targets. It runs the same work the single
# pre-migration job did, in parallel with the rest instead of in front of it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
