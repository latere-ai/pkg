# The per-push gate configuration for pkg. Every check runs from
# latere.ai/x/ci-gate, pinned in go.mod, so each one runs the same on a laptop
# as it does on a runner.
#
# This module is the one 16 repositories depend on, so a gate that slips here
# is a gate that slips fleet-wide.

cover:
  trim_prefix: latere.ai/x/pkg/
  # No exemptions. Every package clears the floor on its own.
  exempt: {}

hermetic:
  # The system directories, and nothing else. Naming them is the point: two
  # packages here genuinely drive external binaries, and the empty setting
  # found them rather than letting them inherit whatever a developer's PATH
  # happened to hold.
  #
  #   cmdexec  runs true, echo, printf, sh and bash -- exercising real command
  #            execution is the package's entire purpose
  #   gitutil  runs git, for the same reason
  #
  # Anything a test needs beyond these two directories has to be added here,
  # which is a decision someone makes rather than an accident.
  allow: [/usr/bin, /bin]

depcheck:
  # llmdialect is stdlib-only, and that is a promise other repositories build
  # on: tgo's own footprint gate watches this subtree from the outside because
  # its server carries the three wire dialects. Watching it from the outside
  # catches the breakage; watching it here is where it can be prevented.
  #
  # The allowlist is empty on purpose. Any module at all is a violation.
  packages:
    latere.ai/x/pkg/llmdialect:
      decision: llmdialect-stdlib-only
      allow: {}

# Gates this repository does not run yet. Each entry is temporary by
# construction: after the date the gate runs and fails on its own terms.
waive:
  license:
    reason: >-
      LICENSE declares Apache-2.0 at the root and no file carries the SPDX
      notice yet; printing it into every file is one mechanical commit, made
      once the holder line is settled for the organisation
    until: 2026-10-31
