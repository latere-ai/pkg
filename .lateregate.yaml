# The per-push gate configuration for pkg. Every check runs from
# latere.ai/x/ci-gate, pinned in go.mod, so each one runs the same on a laptop
# as it does on a runner.
#
# This module is the one 16 repositories depend on, so a gate that slips here
# is a gate that slips fleet-wide.

cover:
  trim_prefix: latere.ai/x/pkg/
  # No exemptions. Every package clears the floor on its own.
  exempt: {}

hermetic:
  # The system directories, and nothing else. Naming them is the point: two
  # packages here genuinely drive external binaries, and the empty setting
  # found them rather than letting them inherit whatever a developer's PATH
  # happened to hold.
  #
  #   cmdexec      runs true, echo, printf, sh and bash -- exercising real
  #                command execution is the package's entire purpose
  #   gitutil      runs git, for the same reason
  #   hostsandbox  runs sh, echo, env and ps around stand-ins for srt and
  #                sandbox-exec; the tests that need a real srt skip when PATH
  #                has none, and those that need macOS's /usr/bin/sandbox-exec
  #                and /usr/bin/curl skip on any other system
  #
  # Anything a test needs beyond these two directories has to be added here,
  # which is a decision someone makes rather than an accident.
  allow: [/usr/bin, /bin]

depcheck:
  # llmdialect reaches the standard library and the Go SDK's wire types, and
  # that is a promise other repositories build on: forma's own footprint gate
  # watches this subtree from the outside because its server carries the three
  # wire dialects. Watching it from the outside catches the breakage; watching
  # it here is where it can be prevented.
  #
  # The one allowance is the SDK's llm/wire, the lux dialect's types, which
  # imports the standard library alone and sends nothing: the public client
  # and the gateway's codec share it, so they cannot drift. The rest of the
  # SDK, its HTTP client and token exchange among it, is a violation, as is
  # any other module.
  packages:
    latere.ai/x/pkg/llmdialect:
      decision: llmdialect-sdk-wire-only
      allow:
        latere.ai/x/sdk-go/llm/wire: the lux wire types and the IR's vocabularies; it imports the standard library alone and sends nothing
    # agentweb is served by static sites whose whole binary is an embedded
    # tree and this package; standard library only keeps that true.
    latere.ai/x/pkg/agentweb:
      decision: agentweb-stdlib-only
      allow: {}
    # verdict is imported into every decision point's hot path, so it
    # reaches the standard library alone.
    latere.ai/x/pkg/verdict:
      decision: verdict-stdlib-only
      allow: {}

license:
  # The identifier every source file carries and the holder it names. There
  # is no default: this is the decision the gate checks the tree against.
  # `go tool lateregate license -w` writes the notice where it is missing.
  spdx: Apache-2.0
  holder: Latere AI
  extensions: ['.go']
  names: [Makefile]

# The identity shape of the family: specs/infrastructure/identity.md in latere-ai/specs
identity:
  role: none
  # Access is by role (identity id-09); one way by design.
  roles_only: true
